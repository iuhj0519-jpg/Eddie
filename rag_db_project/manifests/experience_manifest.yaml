schema_version: "1.0"
manifest_id: workspace_debug_experience_v1
status: draft_until_first_validated_debug_run
purpose: Retrieve evidence-backed debugging experience from current Workspace iterations.

retrieval_sources:
  narrative:
    - experiments/automated_verification/**/diagnosis.md
    - experiments/automated_verification/**/spec_change_proposal.md
  structured:
    - experiments/automated_verification/**/run_manifest.yaml
    - experiments/automated_verification/**/findings.yaml
    - experiments/automated_verification/**/approval.yaml
  artifact_metadata:
    - artifacts/synthesis/**/run_manifest.yaml
    - artifacts/synthesis/**/run_summary.txt
    - artifacts/verification/**/verification_result.json
    - artifacts/verification/**/run_summary.yaml

direct_evidence_sources:
  - artifacts/synthesis/**/*.rpt
  - artifacts/verification/**/*.log
  - artifacts/verification/**/*.json

denied_sources:
  - historical_baselines/**
  - external_web
  - external_llm_api

retrieval_rules:
  - preserve_observed_hypothesis_rejected_validated_labels
  - cite_run_id_finding_id_and_artifact_path
  - prefer_validated_resolution_over_unverified_hypothesis
  - report_unknown_when_evidence_is_missing
  - never_treat_pending_proposal_as_approved_spec
