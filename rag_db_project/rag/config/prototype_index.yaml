schema_version: "1.0"
index_id: prototype_generation_v1
source_manifest: manifests/source_manifest.yaml
access_policy: manifests/phase_access_policy.yaml
checksum_inventory: manifests/checksums/source_files.sha256
phase: prototype_generation
source_git_tag: rag-input-baseline-v1.0

chunking:
  markdown_max_chars: 6000
  rtl_max_lines: 100
  rtl_context_lines: 40

dense_index:
  algorithm: deterministic_feature_hash_v1
  dimension: 384
  features:
    - lowercase_tokens
    - identifier_subtokens
    - character_trigrams

sparse_index:
  engine: sqlite_fts5
  ranking: bm25

hybrid_retrieval:
  dense_weight: 0.55
  sparse_weight: 0.45
  default_top_k: 8
