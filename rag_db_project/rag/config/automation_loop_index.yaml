schema_version: "1.0"
index_id: workspace_automation_loop_v1
status: approved
source_manifest: manifests/automation_loop_manifest.yaml
access_policy: manifests/phase_access_policy.yaml
checksum_inventory: manifests/checksums/automation_loop_files.sha256
phase: automation_loop
source_git_tag: pending-automation-loop-v1

chunking:
  markdown_max_chars: 6000
  structured_record_unit: finding
  raw_log_embedding: false
  rtl_max_lines: 100
  rtl_context_lines: 40

dense_index:
  algorithm: deterministic_feature_hash_v1
  dimension: 384

sparse_index:
  engine: sqlite_fts5
  ranking: bm25

hybrid_retrieval:
  dense_weight: 0.45
  sparse_weight: 0.55
  default_top_k: 8

answer_contract:
  required_citations: [run_id, finding_id, artifact_path]
  preferred_resolution_state: validated
  pending_findings_must_be_labeled: true
  missing_evidence_action: unknown

smoke_test:
  denied_prefixes: [historical_baselines/]
  cases:
    - id: dsp_parallelism_finding
      query: Why were only five DSP48 blocks inferred for the 5 by 5 Systolic Array?
      expected_path: experiments/automation_loop/optimized_accelerator/run_001/
      expected_token: PPA-DSP-001
    - id: weight_storage_bottleneck
      query: Why did Weight SRAM consume most LUT and no Block RAM?
      expected_path: experiments/automation_loop/optimized_accelerator/run_001/
      expected_token: PPA-WEIGHT-001
    - id: address_path_diagnosis
      query: Which failing path includes address control generation and memory access latency?
      expected_path: experiments/automation_loop/optimized_accelerator/review_20260907/
      expected_token: PPA-ADDRESS-001
    - id: fanout_path_diagnosis
      query: Which high fanout drivers require load distribution and timing review?
      expected_path: experiments/automation_loop/optimized_accelerator/review_20260907/
      expected_token: PPA-FANOUT-001
    - id: mux_pipeline_diagnosis
      query: Which failing path traverses dedicated MUX resources and selection depth?
      expected_path: experiments/automation_loop/optimized_accelerator/review_20260907/
      expected_token: PPA-MUX-001
    - id: physical_weight_memory_mapping
      query: SRAM module name or synchronous output register does not prove BRAM inference
      expected_path: experiments/automation_loop/optimized_accelerator/review_20260908/
      expected_token: PPA-MEMORY-MAPPING-001
