    raw_request: 디버깅하겠습니다. 최적화 고려 대상에 대한 승인안을 모두 적용해서 최적화를 진행해주세요. Git 상에 문서화한 정책에
      맞춰 코드를 디버깅해주세요. (LLM API 접근 없이 RAG 문서만 기반으로 하고 이전 대화 내용을 기반으로 하지 않아야 함) Loop
      시스템에 의해 디버깅하고 나면 Simulation/SAIF/Synthesis까지 모두 자동 실행되고 결과까지 분석한 다음 SPEC 문서에
      반영될 것입니다. 여기까지 진행해주세요. 디버깅 후 생성된 코드는 rag_debug_output_001에 로드될 것이고 이는 제가 확인하겠습니다.
      반영된 모든 것들은 Git 상에 commit, push까지 완료해주세요. 마무리 분석이 끝나면 최종적으로 Project_Git에 통합하겠습니다.
