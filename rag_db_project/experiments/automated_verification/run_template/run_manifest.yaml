evidence:
  approved_spec: ""
  approved_spec_sha256: ""
  retrieval_index_manifest: ""
  external_search_allowed: false
  historical_baseline_access_allowed: false

inputs:
  rtl_root: ""
  testbench_top: top_sim
  memory_root: ""
